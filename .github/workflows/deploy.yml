name: Deploy FidePaz V2.0 Staging

on:
  push:
    branches: [main]

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build backend binary (Linux, para el hosting cPanel)
        working-directory: backend
        run: go build -o fidepaz-backend .

      - name: Deploy to staging via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # ftp.mercageek.com resuelve a IPs anycast de Cloudflare (proxy "orange cloud"),
          # que no reenvía TCP/FTP crudo en el puerto 21 (Cloudflare nunca protegió el FTP,
          # solo HTTP/HTTPS) — se usa el hostname real del servidor cPanel para FTP.
          server: chir205.websitehostserver.net
          port: 21
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /home/mercagee/public_html/v2.fidepaz.org/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/BackUp_28_Julio_2026/**
            **/knowledge/**
            **/*.sql
            **/.env
            **/.env.*
