<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estado de Cuenta — FidePaz</title>
    <meta name="description" content="Estado de cuenta oficial de la Asociación de Colonos FidePaz, por año y por mes.">
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        /* Estilos propios de esta página de estado de cuenta -- reutiliza
           las variables de color de main.css (--color-primary, etc.), no
           inventa una paleta nueva. Sin !important, sin estilos inline en
           el HTML (todo vive aquí, en la única hoja de estilos de esta
           página). */
        .eoc-hero {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            color: #fff;
            padding: var(--space-lg) 0;
        }

        .eoc-hero .eyebrow {
            opacity: 0.85;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .eoc-hero h1 {
            margin: 0.4rem 0 0;
            font-size: 1.9rem;
        }

        .eoc-hero .owner-name {
            font-size: 1.15rem;
            opacity: 0.95;
            margin-top: 0.3rem;
        }

        .eoc-summary {
            margin-top: -2.5rem;
        }

        .eoc-card {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: var(--space-md);
        }

        .eoc-summary-value {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .eoc-summary-value.paid { color: #0e9f6e; }
        .eoc-summary-value.pending { color: var(--color-danger); }

        .eoc-summary-label {
            color: var(--color-text-muted);
            font-size: 0.85rem;
            margin-top: 0.2rem;
        }

        .eoc-year-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: var(--space-md) 0;
        }

        .eoc-year-tab {
            border: 1px solid var(--color-border);
            background: var(--color-bg-alt);
            color: var(--color-text);
            border-radius: 999px;
            padding: 0.4rem 1.1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .eoc-year-tab.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: #fff;
        }

        .eoc-month-grid {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-sm);
        }

        .eoc-month-card {
            flex: 1 1 calc(25% - var(--space-sm));
            min-width: 220px;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: var(--space-sm);
        }

        .eoc-month-card .month-name {
            font-weight: 700;
            text-transform: capitalize;
        }

        .eoc-month-card .month-amount {
            font-size: 1.3rem;
            font-weight: 700;
            margin: 0.35rem 0;
        }

        .eoc-badge {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .eoc-badge.paid { background: #def7ec; color: #03543f; }
        .eoc-badge.pending { background: #fde8e8; color: #9b1c1c; }

        .eoc-actions {
            display: flex;
            gap: 0.75rem;
            margin: var(--space-md) 0;
        }

        .eoc-loading, .eoc-empty {
            text-align: center;
            padding: var(--space-lg) 0;
            color: var(--color-text-muted);
        }

        @media print {
            .site-header, .eoc-actions, .eoc-year-tabs, .footer, .site-footer {
                display: none !important;
            }
            .eoc-hero {
                background: var(--color-primary) !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

<header class="site-header container">
    <a href="../" class="brand">
        <img class="logo" src="../assets/img/fidepaz-logo.png" alt="FidePaz">
    </a>
    <nav>
        <ul class="site-nav">
            <li><a href="../">Sitio público</a></li>
            <li><a href="../administrator/">Volver al panel</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="eoc-hero">
        <div class="container">
            <p class="eyebrow">Asociación de Colonos FidePaz</p>
            <h1>Estado de Cuenta</h1>
            <p class="owner-name" id="eoc-owner-name">Cargando información…</p>
        </div>
    </section>

    <div class="container eoc-summary">
        <div class="arf-grid">
            <div class="eoc-card arf-col-3">
                <p class="eoc-summary-value paid" id="eoc-total-paid">—</p>
                <p class="eoc-summary-label">Total pagado (histórico)</p>
            </div>
            <div class="eoc-card arf-col-3">
                <p class="eoc-summary-value pending" id="eoc-total-pending">—</p>
                <p class="eoc-summary-label">Saldo pendiente</p>
            </div>
            <div class="eoc-card arf-col-3">
                <p class="eoc-summary-value" id="eoc-total-quotas">—</p>
                <p class="eoc-summary-label">Cuotas registradas</p>
            </div>
        </div>
    </div>

    <section class="container">
        <div class="eoc-actions">
            <button type="button" class="btn" onclick="window.print()">🖨️ Imprimir / Guardar como PDF</button>
        </div>

        <h2>Por año</h2>
        <div class="eoc-year-tabs" id="eoc-year-tabs"></div>

        <div id="eoc-content">
            <p class="eoc-loading">Cargando estado de cuenta…</p>
        </div>
    </section>
</main>

<footer class="site-footer container">
    <p>Documento generado el <span id="eoc-print-date"></span> — Asociación de Colonos FidePaz A.C.</p>
</footer>

<script>
(function () {
    'use strict';

    var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

    // Base de API relativa al origen actual (2026-08-08): en producción
    // esta página vive en https://v2.fidepaz.org/reportes/..., en local en
    // http://localhost/FidePaz.org/reportes/... -- calcular el prefijo real
    // en vez de hardcodear el dominio evita que el reporte funcione solo
    // en un entorno (mismo patrón que el <base href> de administrator/index.html).
    var API_BASE = (function () {
        var marker = '/reportes/';
        var path = window.location.pathname;
        var idx = path.indexOf(marker);
        var root = idx >= 0 ? path.slice(0, idx) : '';
        return window.location.origin + root + '/api/v2';
    })();

    function fmtMoney(n) {
        return '$' + Number(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function getParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }

    function getToken() {
        return localStorage.getItem('token');
    }

    function fetchQuotas() {
        var token = getToken();
        if (!token) {
            document.getElementById('eoc-content').innerHTML =
                '<p class="eoc-empty">Inicia sesión en el <a href="../administrator/">panel de colonos</a> para ver tu estado de cuenta.</p>';
            return;
        }

        var userId = getParam('userId');
        var authHeaders = { Authorization: 'Bearer ' + token };

        if (!userId) {
            fetch(API_BASE + '/payment/owners', { headers: authHeaders })
                .then(function (r) { return r.json(); })
                .then(renderData)
                .catch(showLoadError);
        } else {
            fetchAllPages(userId, authHeaders, 1, []);
        }

        var activeUserRaw = localStorage.getItem('activeUser');
        if (activeUserRaw && !userId) {
            try {
                var activeUser = JSON.parse(activeUserRaw);
                document.getElementById('eoc-owner-name').textContent = activeUser.name || '';
            } catch (e) { /* nombre queda con el valor por defecto */ }
        }
    }

    // /payment/quotas-owners/{id} pagina de 20 en 20 -- para el reporte
    // anual completo hay que recorrer todas las páginas antes de agrupar.
    function fetchAllPages(userId, authHeaders, page, accumulated) {
        fetch(API_BASE + '/payment/quotas-owners/' + encodeURIComponent(userId) + '?page=' + page, { headers: authHeaders })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var items = accumulated.concat(data.items || []);
                var totalPages = (data.meta && data.meta.totalPages) || 1;
                if (page < totalPages) {
                    fetchAllPages(userId, authHeaders, page + 1, items);
                } else {
                    renderData({ items: items });
                }
            })
            .catch(showLoadError);
    }

    function showLoadError() {
        document.getElementById('eoc-content').innerHTML =
            '<p class="eoc-empty">No se pudo cargar el estado de cuenta. Intenta de nuevo más tarde.</p>';
    }

    function renderData(data) {
        var items = data.items || [];

        if (items.length === 0) {
            document.getElementById('eoc-content').innerHTML = '<p class="eoc-empty">No hay cuotas registradas todavía.</p>';
            return;
        }

        var totalPaid = 0, totalPending = 0;
        var byYear = {};

        items.forEach(function (q) {
            var amount = Number(q.amount) || 0;
            if (Number(q.status) === 2) { totalPaid += amount; } else { totalPending += amount; }

            var date = q.dueDate ? new Date(q.dueDate) : null;
            var year = date ? date.getFullYear() : 'Sin fecha';
            if (!byYear[year]) { byYear[year] = []; }
            byYear[year].push(q);
        });

        document.getElementById('eoc-total-paid').textContent = fmtMoney(totalPaid);
        document.getElementById('eoc-total-pending').textContent = fmtMoney(totalPending);
        document.getElementById('eoc-total-quotas').textContent = items.length;

        var years = Object.keys(byYear).sort(function (a, b) { return b - a; });
        var currentYear = String(new Date().getFullYear());
        var tabsHtml = '';
        years.forEach(function (y) {
            tabsHtml += '<button type="button" class="eoc-year-tab' + (y === currentYear ? ' active' : '') + '" data-year="' + y + '">' + y + '</button>';
        });
        document.getElementById('eoc-year-tabs').innerHTML = tabsHtml;

        function renderYear(year) {
            var quotas = byYear[year] || [];
            var byMonth = {};
            quotas.forEach(function (q) {
                var date = q.dueDate ? new Date(q.dueDate) : null;
                var m = date ? date.getMonth() : -1;
                if (!byMonth[m]) { byMonth[m] = []; }
                byMonth[m].push(q);
            });

            var months = Object.keys(byMonth).sort(function (a, b) { return a - b; });
            var html = '<div class="eoc-month-grid">';
            months.forEach(function (m) {
                var monthQuotas = byMonth[m];
                var monthTotal = monthQuotas.reduce(function (sum, q) { return sum + (Number(q.amount) || 0); }, 0);
                var allPaid = monthQuotas.every(function (q) { return Number(q.status) === 2; });
                var monthName = m >= 0 ? MESES[m] : 'Sin fecha';
                html += '<div class="eoc-month-card">'
                    + '<p class="month-name">' + monthName + '</p>'
                    + '<p class="month-amount">' + fmtMoney(monthTotal) + '</p>'
                    + '<span class="eoc-badge ' + (allPaid ? 'paid">Pagado' : 'pending">Pendiente') + '</span>'
                    + '</div>';
            });
            html += '</div>';
            document.getElementById('eoc-content').innerHTML = html;
        }

        document.querySelectorAll('.eoc-year-tab').forEach(function (btn) {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.eoc-year-tab').forEach(function (b) { b.classList.remove('active'); });
                btn.classList.add('active');
                renderYear(btn.dataset.year);
            });
        });

        renderYear(years.indexOf(currentYear) >= 0 ? currentYear : years[0]);
    }

    document.getElementById('eoc-print-date').textContent = new Date().toLocaleDateString('es-MX', { year: 'numeric', month: 'long', day: 'numeric' });
    fetchQuotas();
})();
</script>
</body>
</html>
