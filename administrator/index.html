<!DOCTYPE html><html lang="en"><head>
  <meta charset="utf-8">
  <title>Administrador - Asociación de Colonos de FIDEPAZ</title>
  <script>
  /* Base href dinamico (2026-08-05): calcula el prefijo real de montaje
     buscando "/administrator/" en la URL actual, en vez de asumir un valor
     fijo. Funciona igual en produccion (https://v2.fidepaz.org/administrator/
     -> "/administrator/") y en XAMPP local
     (http://localhost/FidePaz.org/administrator/ -> "/FidePaz.org/administrator/"),
     sin necesitar dos versiones de este archivo. document.write se ejecuta
     de forma sincrona durante el parseo del HTML, ANTES de que el navegador
     resuelva los <link>/<script> siguientes -- por eso debe ir en esta
     posicion exacta, antes de cualquier recurso relativo. */
  (function () {
    var marker = '/administrator/';
    var path = window.location.pathname;
    var idx = path.indexOf(marker);
    var base = idx >= 0 ? path.slice(0, idx + marker.length) : marker;
    document.write('<base href="' + base + '">');
  })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">

<body>

<script src="runtime.aac71ca4f4190534.js" type="module"></script><script src="polyfills.b8f87d09a688ccd9.js" type="module"></script><script src="main.a7b24cbc3ace442e.js" type="module"></script>
<script>
(function () {
  // Fix de autofill (2026-08-05): ver comentario en styles.797a1963c7237044.css.
  // Solo despacha un evento 'input' nativo cuando el navegador autocompleta
  // un campo -- nunca modifica valores ni toca el bundle de Angular.
  document.addEventListener('animationstart', function (e) {
    if (e.animationName === 'onAutoFillStart') {
      e.target.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }, true);
})();
(function () {
  // Fix de colapso visual del login (2026-08-05): la tarjeta de login trae
  // una altura fija en linea (style="height:500px") horneada en el bundle
  // compilado de Angular -- con textos mas largos, zoom del navegador o
  // pantallas angostas, el contenido (titulo + formulario + boton) excede
  // esos 500px y el layout "flex + items-center" centra todo el bloque
  // dentro de una caja mas chica que su contenido, causando que
  // "Inicio de sesion" quede encimado con "Email". No se puede sobrescribir
  // un estilo en linea desde una hoja de estilos externa sin !important
  // (prohibido) -- en su lugar se limpia el estilo en linea por JS en
  // cuanto Angular renderiza la tarjeta, dejando que la regla de
  // styles.797a1963c7237044.css (min-height + altura automatica) controle
  // el alto real.
  var selector = '.flex.bg-gray-200.shadow-xl.border-slate-500';
  function limpiarAlturaFija(el) {
    if (el && el.style && el.style.height) {
      el.style.removeProperty('height');
    }
  }
  document.querySelectorAll(selector).forEach(limpiarAlturaFija);
  var observer = new MutationObserver(function () {
    document.querySelectorAll(selector).forEach(limpiarAlturaFija);
  });
  observer.observe(document.body, { childList: true, subtree: true });
})();
(function () {
  // Botón de modo día/noche + botón "subir arriba" (2026-08-09) — igual
  // que los fixes anteriores, JS/CSS puro inyectado junto al bundle de
  // Angular, sin tocar ninguna instrucción compilada. El panel YA trae
  // clases `dark:` de Tailwind compiladas en formularios/modales
  // (estrategia "class" -- se activan solo con `.dark` en <html>); este
  // script agrega esa clase y respaldo CSS adicional para que el resto
  // de la página (fondo, tarjetas, tablas) también se vea oscuro, no
  // solo los formularios.
  var THEME_KEY = 'fidepaz_admin_theme';

  function applyTheme(theme) {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    var btn = document.getElementById('fp-theme-toggle');
    if (btn) { btn.textContent = theme === 'dark' ? '☀️' : '🌙'; }
  }

  function initTheme() {
    var saved = localStorage.getItem(THEME_KEY);
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(theme);
  }

  function buildFloatingButtons() {
    var themeBtn = document.createElement('button');
    themeBtn.id = 'fp-theme-toggle';
    themeBtn.type = 'button';
    themeBtn.setAttribute('aria-label', 'Cambiar modo día/noche');
    themeBtn.className = 'fp-float-btn fp-theme-btn';
    themeBtn.addEventListener('click', function () {
      var next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });

    var topBtn = document.createElement('button');
    topBtn.id = 'fp-scroll-top';
    topBtn.type = 'button';
    topBtn.setAttribute('aria-label', 'Subir al inicio');
    topBtn.className = 'fp-float-btn fp-scroll-top-btn';
    topBtn.textContent = '↑';
    topBtn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.body.appendChild(themeBtn);
    document.body.appendChild(topBtn);

    window.addEventListener('scroll', function () {
      topBtn.classList.toggle('fp-visible', window.scrollY > 300);
    });
  }

  initTheme();
  if (document.body) {
    buildFloatingButtons();
  } else {
    document.addEventListener('DOMContentLoaded', buildFloatingButtons);
  }
})();
(function () {
  // Enlace al nuevo "Estado de cuenta" elegante (2026-08-08) — igual que
  // los botones flotantes de arriba: JS/CSS inyectado junto al bundle de
  // Angular, sin tocar ninguna instrucción compilada ni el botón de
  // descarga de Excel que ya existe (se deja intacto). Se muestra solo en
  // las pantallas de cuotas/pagos/reportes, detectadas por el pathname
  // que expone el Router de Angular (SPA, sin recarga real -- por eso hay
  // que parchear pushState/replaceState para saber cuándo cambia la ruta).
  var TARGET_PATTERNS = [/\/home\/reports\/state-owner(?:\/(\d+))?/, /\/home\/(quotas|payments|reports)\b/];

  function findOwnerId(pathname) {
    var m = pathname.match(/\/home\/reports\/state-owner\/(\d+)/);
    return m ? m[1] : null;
  }

  function computeReportHref() {
    var pathname = window.location.pathname;
    var matches = TARGET_PATTERNS.some(function (re) { return re.test(pathname); });
    if (!matches) { return null; }

    var marker = '/administrator/';
    var idx = pathname.indexOf(marker);
    var root = idx >= 0 ? pathname.slice(0, idx) : '';
    var ownerId = findOwnerId(pathname);
    var href = root + '/reportes/estado-de-cuenta.html';
    if (ownerId) { href += '?userId=' + ownerId; }
    return href;
  }

  function syncButton() {
    var href = computeReportHref();
    var btn = document.getElementById('fp-estado-cuenta-link');

    if (!href) {
      if (btn) { btn.remove(); }
      return;
    }

    if (!btn) {
      btn = document.createElement('a');
      btn.id = 'fp-estado-cuenta-link';
      btn.className = 'fp-float-btn fp-estado-cuenta-btn';
      btn.target = '_blank';
      btn.rel = 'noopener';
      btn.textContent = '📄';
      btn.title = 'Ver estado de cuenta elegante';
      document.body.appendChild(btn);
    }
    btn.href = href;
  }

  ['pushState', 'replaceState'].forEach(function (method) {
    var original = history[method];
    history[method] = function () {
      var result = original.apply(this, arguments);
      setTimeout(syncButton, 0);
      return result;
    };
  });
  window.addEventListener('popstate', syncButton);

  syncButton();
  if (document.body) {
    // no-op, syncButton ya corrió arriba
  } else {
    document.addEventListener('DOMContentLoaded', syncButton);
  }
})();
</script>
</body></html>
