<!DOCTYPE html><html lang="en"><head>

  <title>Administrador - Asociación de Colonos de FIDEPAZ</title>
  <script>
  /* Base href dinamico (2026-08-05): calcula el prefijo real de montaje
     buscando "/administrator/" en la URL actual, en vez de asumir un valor
     fijo. Funciona igual en produccion (https://v2.fidepaz.org/administrator/
     -> "/administrator/") y en XAMPP local
     (http://localhost/FidePaz.org/administrator/ -> "/FidePaz.org/administrator/"),
     sin necesitar dos versiones de este archivo. document.write se ejecuta
     de forma sincrona durante el parseo del HTML, ANTES de que el navegador
     resuelva los <link>/<script> siguientes -- por eso debe ir en esta
     posicion exacta, antes de cualquier recurso relativo. */
  (function () {
    var marker = '/administrator/';
    var path = window.location.pathname;
    var idx = path.indexOf(marker);
    var base = idx >= 0 ? path.slice(0, idx + marker.length) : marker;
    document.write('<base href="' + base + '">');
  })();
  </script>

<script>
(function () {
  // Fix de autofill (2026-08-05): ver comentario en styles.797a1963c7237044.css.
  // Solo despacha un evento 'input' nativo cuando el navegador autocompleta
  // un campo -- nunca modifica valores ni toca el bundle de Angular.
  document.addEventListener('animationstart', function (e) {
    if (e.animationName === 'onAutoFillStart') {
      e.target.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }, true);
})();
