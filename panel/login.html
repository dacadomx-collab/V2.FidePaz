<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión — Panel FidePaz</title>
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="panel.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-md);
        }

        .login-card {
            width: 100%;
            max-width: 22rem;
            background-color: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
            padding: var(--space-lg) var(--space-md);
        }

        .login-card .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: var(--space-md);
            text-align: center;
        }

        .login-card .brand img {
            height: 3.5rem;
        }

        .login-error {
            background-color: var(--color-danger-soft);
            color: var(--color-danger);
            border-radius: var(--radius);
            padding: 0.6rem 0.85rem;
            font-size: 0.85rem;
            margin-bottom: var(--space-sm);
            display: none;
        }

        .login-error.visible {
            display: block;
        }

        .login-card button[type="submit"] {
            width: 100%;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>

<div class="login-page">
    <div class="login-card">
        <div class="brand">
            <img src="../assets/img/fidepaz-logo.png" alt="FidePaz" onerror="this.style.display='none'">
            <strong>Panel FidePaz</strong>
        </div>

        <p class="login-error" id="login-error"></p>

        <form id="login-form">
            <div class="panel-form-field">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required autocomplete="username">
            </div>
            <div class="panel-form-field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn" id="login-submit">Iniciar sesión</button>
        </form>
    </div>
</div>

<script type="module">
    import { api, setSession, getToken, getActiveUser, panelRoot } from './js/api.js';

    function destinationFor(role) {
        return role === 'owner' ? 'mi-cuenta.html' : 'index.html';
    }

    if (getToken()) {
        const activeUser = getActiveUser();
        window.location.href = panelRoot() + destinationFor(activeUser ? activeUser.role : null);
    }

    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');
    const submitBtn = document.getElementById('login-submit');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorEl.classList.remove('visible');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Ingresando…';

        try {
            const data = await api.post('/auth/login', {
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
            });
            setSession(data.token, data.user);
            window.location.href = panelRoot() + destinationFor(data.user.role);
        } catch (err) {
            errorEl.textContent = err.message || 'No se pudo iniciar sesión.';
            errorEl.classList.add('visible');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Iniciar sesión';
        }
    });
</script>
</body>
</html>
