<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cuotas — Panel FidePaz</title>
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="panel.css">
</head>
<body>

<div id="panel-shell-root"></div>

<script type="module">
    import { api, getToken, goToLogin } from './js/api.js';
    import { renderShell } from './js/shell.js';
    import { createDataTable } from './js/components/dataTable.js';
    import { toast } from './js/toast.js';

    if (!getToken()) { goToLogin(); }

    const content = renderShell('cuotas', 'Cuotas (catálogo)');

    content.innerHTML = `
        <div class="panel-toolbar">
            <button type="button" class="btn" id="btn-nuevo">+ Nuevo tipo de cuota</button>
        </div>
        <div id="table-mount"></div>
        <div id="modal-mount"></div>
    `;

    const tableMount = document.getElementById('table-mount');
    const modalMount = document.getElementById('modal-mount');
    const rowsById = new Map();

    const table = createDataTable(tableMount, {
        searchPlaceholder: 'Buscar por nombre…',
        emptyMessage: 'No hay tipos de cuota registrados con ese criterio.',
        defaultSortKey: 'name',
        columns: [
            { key: 'name', label: 'Nombre', sortable: true },
            { key: 'cost', label: 'Costo', sortable: true, render: (i) => `$${Number(i.cost).toLocaleString('es-MX', { minimumFractionDigits: 2 })}` },
        ],
        renderActions: (item) => `
            <button type="button" data-action="edit" title="Editar">✏️</button>
            <button type="button" data-action="delete" title="Eliminar">🗑️</button>
        `,
        fetchPage: async ({ search, sortKey, sortDir, page }) => {
            const data = await api.get('/quota/filter', { name: search, sortKey, sortDir, page });
            data.items.forEach((item) => rowsById.set(String(item.id), item));
            return { items: data.items, meta: data.meta };
        },
    });

    tableMount.addEventListener('click', (event) => {
        const btn = event.target.closest('button[data-action]');
        if (!btn) { return; }
        const id = btn.closest('tr').dataset.id;
        if (btn.dataset.action === 'edit') { openForm(id); }
        if (btn.dataset.action === 'delete') { confirmDelete(id); }
    });

    document.getElementById('btn-nuevo').addEventListener('click', () => openForm(null));

    function closeModal() {
        modalMount.innerHTML = '';
    }

    function openForm(id) {
        const item = id ? rowsById.get(String(id)) : null;

        modalMount.innerHTML = `
            <div class="panel-modal-overlay">
                <div class="panel-modal">
                    <h2>${id ? 'Editar tipo de cuota' : 'Nuevo tipo de cuota'}</h2>
                    <form id="quota-form">
                        <div class="panel-form-field">
                            <label for="f-name">Nombre</label>
                            <input type="text" id="f-name" required value="${item ? item.name : ''}">
                        </div>
                        <div class="panel-form-field">
                            <label for="f-cost">Costo</label>
                            <input type="number" id="f-cost" step="0.01" min="0" required value="${item ? item.cost : ''}">
                        </div>
                        <div class="panel-modal-actions">
                            <button type="button" class="btn btn-outline" id="btn-cancel">Cancelar</button>
                            <button type="submit" class="btn">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        `;

        document.getElementById('btn-cancel').addEventListener('click', closeModal);

        document.getElementById('quota-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const payload = {
                name: document.getElementById('f-name').value.trim(),
                cost: Number(document.getElementById('f-cost').value),
            };

            try {
                if (id) {
                    await api.put(`/quota/update/${id}`, payload);
                    toast('Tipo de cuota actualizado.');
                } else {
                    await api.post('/quota/create', payload);
                    toast('Tipo de cuota creado.');
                }
                closeModal();
                table.reload();
            } catch (err) {
                toast(err.message, { type: 'error' });
            }
        });
    }

    function confirmDelete(id) {
        modalMount.innerHTML = `
            <div class="panel-modal-overlay">
                <div class="panel-modal">
                    <h2>Eliminar tipo de cuota</h2>
                    <p>Esta acción no se puede deshacer. Si alguna propiedad activa usa esta cuota, el servidor rechazará el borrado. ¿Confirmas eliminar este registro?</p>
                    <div class="panel-modal-actions">
                        <button type="button" class="btn btn-outline" id="btn-cancel-delete">Cancelar</button>
                        <button type="button" class="btn" id="btn-confirm-delete">Eliminar</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('btn-cancel-delete').addEventListener('click', closeModal);
        document.getElementById('btn-confirm-delete').addEventListener('click', async () => {
            try {
                await api.del(`/quota/delete/${id}`);
                toast('Tipo de cuota eliminado.');
                closeModal();
                table.reload();
            } catch (err) {
                toast(err.message, { type: 'error' });
            }
        });
    }
</script>
</body>
</html>
