<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Informes Financieros — Panel FidePaz</title>
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="panel.css">
</head>
<body>

<div id="panel-shell-root"></div>

<script type="module">
    import { api, getToken, goToLogin, resolveDocUrl } from './js/api.js';
    import { renderShell } from './js/shell.js';
    import { createDataTable } from './js/components/dataTable.js';
    import { toast } from './js/toast.js';

    if (!getToken()) { goToLogin(); }

    const content = renderShell('informes', 'Informes Financieros');

    content.innerHTML = `
        <div class="panel-toolbar">
            <button type="button" class="btn" id="btn-nuevo">+ Nuevo informe</button>
        </div>
        <div id="table-mount"></div>
        <div id="modal-mount"></div>
    `;

    const tableMount = document.getElementById('table-mount');
    const modalMount = document.getElementById('modal-mount');
    const rowsById = new Map();

    const table = createDataTable(tableMount, {
        searchPlaceholder: 'Buscar informe por título…',
        emptyMessage: 'No hay informes financieros con ese criterio.',
        defaultSortKey: 'published_at',
        defaultSortDir: 'desc',
        columns: [
            { key: 'title', label: 'Título', sortable: true },
            { key: 'published_at', label: 'Fecha del informe', sortable: true, render: (i) => (i.published_at || '').slice(0, 10) || '—' },
            { key: 'status', label: 'Estatus', sortable: true, render: (i) => `<span class="panel-badge">${i.status === 'published' ? 'Publicado' : 'Borrador'}</span>` },
            { key: 'visibility', label: 'Visibilidad', render: (i) => `<span class="panel-badge">${i.visibility === 'public' ? '🌐 Público' : '🔒 Privado'}</span>` },
            { key: 'archivo_pdf_url', label: 'PDF', render: (i) => {
                if (!i.archivo_pdf_url) { return '—'; }
                const url = escapeHtml(resolveDocUrl(i.archivo_pdf_url));
                return `<a href="${url}" target="_blank">👁 Ver</a> · <a href="${url}" download>⬇ Descargar</a>`;
            } },
        ],
        renderActions: (item) => `
            <button type="button" data-action="edit" title="Editar">✏️</button>
            <button type="button" data-action="delete" title="Eliminar">🗑️</button>
        `,
        fetchPage: async ({ search, sortKey, sortDir, page }) => {
            // category='reportes' fijo -- este módulo gestiona únicamente los
            // Informes Financieros, no Comunicados/Financiero (ver panel/comunicados.html
            // para esas dos categorías). Misma tabla `announcements`, mismo endpoint admin.
            const data = await api.get('/announcements', { q: search, category: 'reportes', sortKey, sortDir, page });
            data.items.forEach((item) => rowsById.set(String(item.id), item));
            return { items: data.items, meta: data.meta };
        },
    });

    tableMount.addEventListener('click', (event) => {
        const btn = event.target.closest('button[data-action]');
        if (!btn) { return; }
        const id = btn.closest('tr').dataset.id;
        if (btn.dataset.action === 'edit') { openForm(id); }
        if (btn.dataset.action === 'delete') { confirmDelete(id); }
    });

    document.getElementById('btn-nuevo').addEventListener('click', () => openForm(null));

    function closeModal() {
        modalMount.innerHTML = '';
    }

    function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function openForm(id) {
        const item = id ? rowsById.get(String(id)) : null;

        modalMount.innerHTML = `
            <div class="panel-modal-overlay">
                <div class="panel-modal">
                    <h2>${id ? 'Editar informe' : 'Nuevo informe financiero'}</h2>
                    <form id="inf-form">
                        <div class="panel-form-field">
                            <label for="f-title">Título</label>
                            <input type="text" id="f-title" required value="${item ? escapeHtml(item.title) : ''}" placeholder="Ej. Reporte de cuotas y gastos — Agosto 2026">
                        </div>
                        <div class="panel-form-field">
                            <label for="f-date">Fecha del informe (periodo que reporta)</label>
                            <input type="date" id="f-date" required value="${item && item.published_at ? item.published_at.slice(0, 10) : ''}">
                        </div>
                        <div class="panel-form-field">
                            <label for="f-excerpt">Resumen (opcional)</label>
                            <input type="text" id="f-excerpt" value="${item ? escapeHtml(item.excerpt) : ''}">
                        </div>
                        <div class="panel-form-field">
                            <label for="f-content">Notas / contenido</label>
                            <textarea id="f-content" class="panel-textarea" rows="4" required>${item ? escapeHtml(item.content) : ''}</textarea>
                        </div>
                        <div class="panel-form-field">
                            <label for="f-status">Estatus</label>
                            <select id="f-status">
                                <option value="published" ${!item || item.status === 'published' ? 'selected' : ''}>Publicado</option>
                                <option value="draft" ${item && item.status === 'draft' ? 'selected' : ''}>Borrador</option>
                            </select>
                        </div>
                        <div class="panel-form-field">
                            <label for="f-visibility">Visibilidad</label>
                            <select id="f-visibility">
                                <option value="private" ${!item || item.visibility !== 'public' ? 'selected' : ''}>🔒 Privado (solo panel, requiere sesión)</option>
                                <option value="public" ${item && item.visibility === 'public' ? 'selected' : ''}>🌐 Público (se muestra también en la Landing Page)</option>
                            </select>
                        </div>
                        <div class="panel-form-field">
                            <label for="f-pdf">Archivo PDF ${item && item.archivo_pdf_url ? '(reemplazar)' : ''}</label>
                            <input type="file" id="f-pdf" accept="application/pdf" ${item ? '' : 'required'}>
                            ${item && item.archivo_pdf_url ? `<small><a href="${escapeHtml(resolveDocUrl(item.archivo_pdf_url))}" target="_blank">Ver PDF actual</a></small>` : ''}
                        </div>
                        <div class="panel-modal-actions">
                            <button type="button" class="btn btn-outline" id="btn-cancel">Cancelar</button>
                            <button type="submit" class="btn">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        `;

        document.getElementById('btn-cancel').addEventListener('click', closeModal);

        document.getElementById('inf-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const payload = {
                title: document.getElementById('f-title').value.trim(),
                excerpt: document.getElementById('f-excerpt').value.trim(),
                content: document.getElementById('f-content').value.trim(),
                category: 'reportes',
                status: document.getElementById('f-status').value,
                visibility: document.getElementById('f-visibility').value,
                published_at: document.getElementById('f-date').value,
                archivo_pdf_url: item ? item.archivo_pdf_url : null,
            };

            const pdfFile = document.getElementById('f-pdf').files[0];
            if (pdfFile) {
                if (pdfFile.type !== 'application/pdf') {
                    toast('El archivo debe ser un PDF.', { type: 'error' });
                    return;
                }
                if (pdfFile.size > 10 * 1024 * 1024) {
                    toast('El PDF supera el máximo de 10 MB.', { type: 'error' });
                    return;
                }
                try {
                    const formData = new FormData();
                    formData.append('file', pdfFile);
                    const uploadResult = await api.upload('/announcements/upload', formData);
                    payload.archivo_pdf_url = uploadResult.url;
                } catch (err) {
                    toast(err.message, { type: 'error' });
                    return;
                }
            }

            if (!payload.archivo_pdf_url) {
                toast('Sube el PDF del informe.', { type: 'error' });
                return;
            }

            try {
                if (id) {
                    await api.put(`/announcements/${id}`, payload);
                    toast('Informe actualizado.');
                } else {
                    await api.post('/announcements', payload);
                    toast('Informe creado.');
                }
                closeModal();
                table.reload();
            } catch (err) {
                toast(err.message, { type: 'error' });
            }
        });
    }

    function confirmDelete(id) {
        modalMount.innerHTML = `
            <div class="panel-modal-overlay">
                <div class="panel-modal">
                    <h2>Eliminar informe</h2>
                    <p>Esta acción no se puede deshacer. ¿Confirmas eliminar este registro?</p>
                    <div class="panel-modal-actions">
                        <button type="button" class="btn btn-outline" id="btn-cancel-delete">Cancelar</button>
                        <button type="button" class="btn" id="btn-confirm-delete">Eliminar</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('btn-cancel-delete').addEventListener('click', closeModal);
        document.getElementById('btn-confirm-delete').addEventListener('click', async () => {
            try {
                await api.del(`/announcements/${id}`);
                toast('Informe eliminado.');
                closeModal();
                table.reload();
            } catch (err) {
                toast(err.message, { type: 'error' });
            }
        });
    }
</script>
</body>
</html>
